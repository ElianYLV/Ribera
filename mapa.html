<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos y título del mapa específico de Cuexcomatitlán (u otro pueblo). -->
    <!-- Este archivo carga un mapa Leaflet con marcadores y una leyenda de categorías. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bienvenido a Cuexcomatitlán</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <!-- Estilos para el mapa, tarjeta informativa, leyenda y botones. -->
    <style>

    .custom-popup .leaflet-popup-content {
    width: 240px !important;
    margin: 12px;
}

.custom-popup .leaflet-popup-content-wrapper {
    border-radius: 14px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
}

.custom-popup .leaflet-popup-tip {
    box-shadow: none;
}

.custom-popup.popup-red .leaflet-popup-content-wrapper,
.custom-popup.popup-red .leaflet-popup-tip {
    background: #fef2f2;
}

.custom-popup.popup-green .leaflet-popup-content-wrapper,
.custom-popup.popup-green .leaflet-popup-tip {
    background: #ecfdf5;
}

.custom-popup.popup-orange .leaflet-popup-content-wrapper,
.custom-popup.popup-orange .leaflet-popup-tip {
    background: #fff7ed;
}

.custom-popup.popup-yellow .leaflet-popup-content-wrapper,
.custom-popup.popup-yellow .leaflet-popup-tip {
    background: #fefce8;
}

.custom-popup.popup-purple .leaflet-popup-content-wrapper,
.custom-popup.popup-purple .leaflet-popup-tip {
    background: #f5f3ff;
}

.custom-popup.popup-red .popup-button {
    background: linear-gradient(135deg, #dc2626, #ef4444);
}

.custom-popup.popup-green .popup-button {
    background: linear-gradient(135deg, #059669, #10b981);
}

.custom-popup.popup-orange .popup-button {
    background: linear-gradient(135deg, #ea580c, #f97316);
}

.custom-popup.popup-yellow .popup-button {
    background: linear-gradient(135deg, #ca8a04, #eab308);
}

.custom-popup.popup-purple .popup-button {
    background: linear-gradient(135deg, #7c3aed, #8b5cf6);
}

.custom-popup .popup-button {
    display: inline-block;
    padding: 10px 16px;
    border-radius: 8px;
    color: white;
    font-weight: 600;
    text-decoration: underline;
    text-decoration-color: currentColor;
}

.popup-image{
    display:block;
    width:100%;
    max-width:220px;
    height:150px;
    object-fit:cover;
    margin:10px auto;
    border-radius:10px;
}
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f3f6fa;
      }
      #map {
        height: 100%;
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .map-frame {
        position: relative;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
       }
      .map-card {
        position: absolute;
        left: 14px;
        top: 14px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.10);
        max-width: 280px;
        backdrop-filter: blur(8px);
      } 
      .map-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
      }
      .map-card h1 {
        margin: 0 0 6px;
        font-size: 1rem;
        color: #2d3748;
        font-weight: 700;
      }
      .map-card p {
        margin: 0 0 10px;
        color: #4a5568;
        line-height: 1.4;
        font-size: 0.92rem;
      }
      .style-button {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.82rem;
        cursor: pointer;
        font-weight: 500;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
      }
      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      .map-legend {
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: 1000;
        width: 180px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 14px;
        padding: 10px 12px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.10);
        backdrop-filter: blur(8px);
      }
      .map-legend h2 {
        margin: 0 0 8px;
        color: #1f2937;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        color: #334155;
        font-size: 0.88rem;
      }
      .legend-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-block;
      }
      .legend-dot.red { background: #ef4444; }
      .legend-dot.green { background: #10b981; }
      .legend-dot.orange { background: #f97316; }
      .legend-dot.yellow { background: #facc15; }
      .legend-dot.purple { background: #8b5cf6; }
      
    </style>
</head>
<body>
    <!-- Contenedor de la página que mantiene el mapa y las tarjetas flotantes. -->
    <div class="map-frame">
      <div class="map-card">
        <h1>Selecciona un punto</h1>
        <p>Haz clic en un marcador para ver más información.</p>
      </div>
      <div class="map-legend">
        <h2>Categorías</h2>
        <div class="legend-item"><span class="legend-dot red"></span>  Lugares turísticos</div>
        <div class="legend-item"><span class="legend-dot green"></span>  Áreas verdes</div>
        <div class="legend-item"><span class="legend-dot orange"></span>  Servicios</div>
        <div class="legend-item"><span class="legend-dot yellow"></span>  Instituciones educativas</div>
        <div class="legend-item"><span class="legend-dot purple"></span>  Hospedaje</div>
      </div>
      <div id="map"></div>
    </div>

    <!-- Carga la librería Leaflet para generar el mapa interactivo. -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Inicializa el mapa en el div #map y fija la vista inicial para este pueblo.
        var map = L.map('map', { zoomControl: false }).setView([20.412500, -103.323000], 13);

        // Tile layer blanco (light)
        var lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        });

        // Tile layer a color (voyager)
        var colorLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        });

        // Iniciar con el layer a color
        colorLayer.addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Geolocalización: muestra la posición del usuario si el navegador lo permite.
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                var userLatLng = [position.coords.latitude, position.coords.longitude];
                if (!window.userLocationMarker) {
                    window.userLocationMarker = L.circleMarker(userLatLng, {
                        radius: 8,
                        color: '#2563eb',
                        fillColor: '#3b82f6',
                        fillOpacity: 0.95,
                        weight: 3
                    }).addTo(map);
                    window.userLocationCircle = L.circle(userLatLng, {
                        radius: 40,
                        color: '#60a5fa',
                        fillColor: '#93c5fd',
                        fillOpacity: 0.2,
                        weight: 1
                    }).addTo(map);
                    window.userLocationMarker.bindPopup('Tu ubicación');
                } else {
                    window.userLocationMarker.setLatLng(userLatLng);
                    window.userLocationCircle.setLatLng(userLatLng);
                }
            }, function() {
                console.warn('No se pudo obtener la ubicación del usuario.');
            }, {
                enableHighAccuracy: true,
                maximumAge: 10000,
                timeout: 20000
            });
        }

        // Iconos personalizados para los marcadores

        var customIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-blue.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        //

        var redIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var greenIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });
        var orangeIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-orange.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var purpleIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-violet.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        var yellowIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-yellow.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
});

        // Definir los marcadores con sus coordenadas, nombres y descripciones
        var locations = [

        {
    name: 'Casa Ejidal Cuexcomatitlán',
    coords: [20.428532, -103.362314],
    description: 'Espacio de reunión donde se realizan actividades relacionadas con la organización y el desarrollo de la comunidad.',
    image: '../imagenes/imgcue/casa ejidal.png'
},
{
    name: 'Malecón de Cuexcomatitlán',
    coords: [20.428225, -103.360761],
    description: 'Un espacio ideal para caminar junto a la laguna y disfrutar de la serenidad que caracteriza a Cuexcomatitlán.',
    image: '../imagenes/imacaji/malecon de cuexco.png'
},
{
    name: 'Templo de Cuexcomatitlán',
    coords: [20.428656, -103.362010],
    description: 'Templo representativo de la comunidad, reconocido por su importancia religiosa, cultural e histórica.',
    image: '../imagenes/imgcue/templo.png'
},
{
    name: 'Unidad Deportiva de Cuexcomatitlán',
    coords: [20.434711, -103.361200],
    description: 'Espacio destinado al deporte, la recreación y la convivencia, donde niños, jóvenes y familias disfrutan de diversas actividades.',
    image: '../imagenes/imgcue/unidad.png'
},
{
    name: 'Escuela Secundaria 73 Foránea',
    coords: [20.433000, -103.360865],
    description: 'Institución educativa que contribuye a la formación académica y al desarrollo de los jóvenes de Cuexcomatitlán.',
    image: '../imagenes/imgcue/secundaria.png'
},
{
    name: 'Rincón "LOS AYALA"',
    coords: [20.429691, -103.361078],
    description: 'Espacio de convivencia donde visitantes y habitantes pueden disfrutar de un ambiente agradable y familiar.',
    image: '../imagenes/imgcue/finca.png'
},
{
    name: 'Finca Cuexco',
    coords: [20.430608, -103.363532],
    description: 'Lugar con un ambiente campestre ideal para reuniones, eventos y momentos de convivencia en la comunidad.',
    image: '../imagenes/imgcue/rincon.png'
},
{
    name: 'Plaza Principal de Cuexcomatitlán',
    coords: [20.428112, -103.362545],
    description: 'El corazón de la comunidad, donde se reúnen las familias y se celebran las principales tradiciones y festividades del pueblo.',
    image: '../imagenes/imgcue/plaza.png'
},
{
    name: 'Orilla del Lago',
    coords: [20.430727, -103.312530],
    description: 'Un lugar perfecto para disfrutar de la tranquilidad de la laguna y contemplar uno de los paisajes más representativos de la Ribera.',
    image: '../imagenes/imacaji/orilla.png'
},
{
    name: 'Muelle San Juan Evangelista',
    coords: [20.406573, -103.312090],
    description: 'Un sitio ideal para apreciar la belleza natural de la laguna y disfrutar de un entorno tranquilo y agradable.',
    image: '../imagenes/imacaji/muelle san juan2.png'
},
{
    name: 'Muelle de San Juan Evangelista',
    coords: [20.406765, -103.317610],
    description: 'Un espacio privilegiado para contemplar la Laguna de Cajititlán y disfrutar de la tranquilidad que ofrece la naturaleza.',
    image: '../imagenes/imacaji/muelle san juan.png'
},
{
    name: 'Escuela Primaria Urbana Manuel López Cotilla Número 711',
    coords: [20.427554, -103.363121],
    description: 'Institución educativa comprometida con la formación académica y el desarrollo integral de niñas y niños de la comunidad.',
    image: '../imagenes/imgcue/primaria.png'
}

        ];

        var cardTitle = document.querySelector('.map-card h1');
        var cardDesc = document.querySelector('.map-card p');
        var cardWrapper = document.querySelector('.map-card');
        var defaultPopupImage = 'Ejem1.jpg'; // Imagen por defecto usada solo si no hay imagen asignada

        /* Mantener interfaz actual: tarjeta actualiza con animación suave al seleccionar marcador */
        function updateCard(location) {
            cardWrapper.classList.add('fade-update');
            cardTitle.textContent = location.name;
            cardDesc.textContent = location.description;
            setTimeout(function() {
                cardWrapper.classList.remove('fade-update');
            }, 260);
        }

        // Agregar marcadores personalizados al mapa
// Lugares turísticos
var redLocations = [
    'Malecon de Cuexcomatitlán',
    'Quiosco de Cuexcomatitlán',
    'Templo de Cuexcomatitlán',
    'Malecón de Cuexcomatitlán',
    'Muelle de San Juan Evangelista',
    'Muelle San Juan Evangelista',
    'Orilla del Lago',
    'Plaza Principal de Cuexcomatitlán'
];

// Naturaleza y recreación
var greenLocations = [
    'Unidad Deportiva de Cuexcomatitlán',
    'Rincón "LOS AYALA"',
    
];

// Servicios
var orangeLocations = [
    'Casa Ejidal Cuexcomatitlán'
];

// Instituciones educativas
var yellowLocations = [
    'Escuela Primaria Urbana Manuel López Cotilla Número 711',
    'Escuela Secundaria 73 Foránea'
];

// Hospedaje
var purpleLocations = [
    'Finca Cuexco'
];


        function getLocationCategory(locationName) {
            if (redLocations.includes(locationName)) {
                return 'red';
            } else if (greenLocations.includes(locationName)) {
                return 'green';
            } else if (purpleLocations.includes(locationName)) {
                return 'purple';
            } else if (yellowLocations.includes(locationName)) {
                return 'yellow';
            } else if (orangeLocations.includes(locationName)) {
                return 'orange';
            }
            return 'default';
        }

        locations.forEach(function(location) {
            var icon = customIcon;
            var category = getLocationCategory(location.name);
            if (category === 'red') {
                icon = redIcon;
            } else if (category === 'green') {
                icon = greenIcon;
            } else if (category === 'purple') {
                icon = purpleIcon;
            } else if (category === 'yellow') {
                icon = yellowIcon;
            } else if (category === 'orange') {
                icon = orangeIcon;
            }

            var marker = L.marker(location.coords, {icon: icon}).addTo(map);
            var popupImage = location.image ? location.image : defaultPopupImage;
            var directionsUrl = 'https://www.google.com/maps/search/?api=1&query=' + location.coords[0] + ',' + location.coords[1];
            var popupContent =
                '<div class="popup-card custom-popup-content">' +
                '<h3 class="popup-title">' + location.name + '</h3>' +
                '<img class="popup-image" src="imagenes/' + popupImage + '" alt="' + location.name + '" onerror="this.onerror=null;this.src=\'imagenes/' + defaultPopupImage + '\'">' +
                '<a class="popup-button" target="_blank" rel="noopener" href="' + directionsUrl + '">Cómo llegar</a>' +
                '</div>';
            marker.bindPopup(popupContent, { className: 'custom-popup popup-' + category, maxWidth: 320 });
            marker.on('click', function() {
                updateCard(location);
            });
        });

        // Agregar ruta con estilo punteado
        var routeCoords = [
            [20.406765, -103.317610],
            [20.415339, -103.337154],
            [20.419739, -103.346137],
            [20.423207, -103.355170],
            [20.428225, -103.360761],
            [20.428034, -103.351684],
            [20.426479, -103.340641],
            [20.424926, -103.332106],
            [20.425462, -103.322724],
            [20.430727, -103.312530],
            [20.406573, -103.312090]
        ];
        
        
        var route = L.polyline(routeCoords, {
            color: '#FF0000',
            weight: 5,
            opacity: 0.8,
            dashArray: '10, 10'
        }).addTo(map);

    </script>
</body>
</html>
