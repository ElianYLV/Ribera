<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mapa interactivo</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      background: #f3f6fa;
      font-family: Arial, Helvetica, sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
    }


    .map-image-button {
      cursor: pointer;
      opacity: 1;
      transform-origin: center bottom;
      filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.28));
      transition: opacity 160ms ease, transform 160ms ease, filter 160ms ease;
    }

    .map-image-button:hover {
      opacity: 0.72;
      transform: translateY(-10px) scale(1.08);
      filter: drop-shadow(0 14px 16px rgba(0, 0, 0, 0.34));
    }

    .leaflet-popup-content {
      margin: 10px 14px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([20.4178, -103.3502], 12);

    L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png", {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
      subdomains: "abcd",
      maxZoom: 20
    }).addTo(map);

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(function (position) {
        const userLatLng = [position.coords.latitude, position.coords.longitude];
        if (!window.userLocationMarker) {
          window.userLocationMarker = L.circleMarker(userLatLng, {
            radius: 8,
            color: '#2563eb',
            fillColor: '#3b82f6',
            fillOpacity: 0.95,
            weight: 3
          }).addTo(map);
          window.userLocationCircle = L.circle(userLatLng, {
            radius: 40,
            color: '#60a5fa',
            fillColor: '#93c5fd',
            fillOpacity: 0.2,
            weight: 1
          }).addTo(map);
          window.userLocationMarker.bindPopup('Tu ubicación');
        } else {
          window.userLocationMarker.setLatLng(userLatLng);
          window.userLocationCircle.setLatLng(userLatLng);
        }
      }, function () {
        console.warn('No se pudo obtener la ubicación del usuario.');
      }, {
        enableHighAccuracy: true,
        maximumAge: 10000,
        timeout: 20000
      });
    }

    const cuexcomatitlanButton = L.icon({
      iconUrl: "imagenes/Logos pueblo/Cuexcomatitlan-Photoroom.png",
      iconSize: [82, 82],
      iconAnchor: [41, 41],
      popupAnchor: [0, -42],
      className: "map-image-button"
    });

    const cajititlanButton = L.icon({
      iconUrl: "imagenes/Logos pueblo/Cajititlan-Photoroom.png",
      iconSize: [82, 82],
      iconAnchor: [41, 41],
      popupAnchor: [0, -42],
      className: "map-image-button"
    });

      const cerroviejoButton = L.icon({
      iconUrl: "imagenes/Logos pueblo/Cerroviejo.png",
      iconSize: [82, 82],
      iconAnchor: [41, 41],
      popupAnchor: [0, -42],
      className: "map-image-button"
    });

      const SanMiguelCuyutlanPhotoroomButton = L.icon({
      iconUrl: "imagenes/Logos pueblo/San Miguel Cuyutlan-Photoroom.png",
      iconSize: [82, 82],
      iconAnchor: [41, 41],
      popupAnchor: [0, -42],
      className: "map-image-button"
    });

      const SanLucasEvangelistaPhotoroom = L.icon({
      iconUrl: "imagenes/Logos pueblo/San Lucas Evangelista-Photoroom.png",
      iconSize: [82, 82],
      iconAnchor: [41, 41],
      popupAnchor: [0, -42],
      className: "map-image-button"
    });

      const SanJuanEvangelistaPhotoroom = L.icon({
      iconUrl: "imagenes/Logos pueblo/San Juan Evangelista-Photoroom.png",
      iconSize: [82, 82],
      iconAnchor: [41, 41],
      popupAnchor: [0, -42],
      className: "map-image-button"
    });


    function abrirPagina(url) {
      window.top.location.href = url;
    }

    L.marker([20.428056, -103.362537], { icon: cuexcomatitlanButton })
  .addTo(map)
  .on("click", function () {
    abrirPagina("cuex_inf.html");
  });

L.marker([20.366420, -103.435300], { icon: cerroviejoButton })
  .addTo(map)
  .on("click", function () {
    abrirPagina("cerroviejo_inf.html");
  });

L.marker([20.431926, -103.308585], { icon: cajititlanButton })
  .addTo(map)
  .on("click", function () {
    abrirPagina("caji_inf.html");
  });

L.marker([20.416660, -103.389628], { icon: SanMiguelCuyutlanPhotoroomButton })
  .addTo(map)
  .on("click", function () {
    abrirPagina("sanmiguel_inf.html");
  });

L.marker([20.407260, -103.361414], { icon: SanLucasEvangelistaPhotoroom })
  .addTo(map)
  .on("click", function () {
    abrirPagina("sanlucas_inf.html");
  });

L.marker([20.402959, -103.314813], { icon: SanJuanEvangelistaPhotoroom })
  .addTo(map)
  .on("click", function () {
    abrirPagina("sanjuan_inf.html");
  });
  </script>
</body>
</html>
