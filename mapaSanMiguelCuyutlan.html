<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Página de mapa de un pueblo: HTML, estilos y scripts para mostrar un mapa Leaflet con marcadores. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mapa de San Miguel Cuyutlán</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <!-- Estilos para la página de mapa: leyenda, tarjeta informativa y contenedor de mapa. -->
    <style>

    .custom-popup .leaflet-popup-content {
    width: 240px !important;
    margin: 12px;
}

.custom-popup .leaflet-popup-content-wrapper {
    border-radius: 14px;
    box-shadow: 0 10px 24px rgba(0, 0, 0, 0.16);
}

.custom-popup .leaflet-popup-tip {
    box-shadow: none;
}

.custom-popup.popup-red .leaflet-popup-content-wrapper,
.custom-popup.popup-red .leaflet-popup-tip {
    background: #fef2f2;
}

.custom-popup.popup-green .leaflet-popup-content-wrapper,
.custom-popup.popup-green .leaflet-popup-tip {
    background: #ecfdf5;
}

.custom-popup.popup-orange .leaflet-popup-content-wrapper,
.custom-popup.popup-orange .leaflet-popup-tip {
    background: #fff7ed;
}

.custom-popup.popup-yellow .leaflet-popup-content-wrapper,
.custom-popup.popup-yellow .leaflet-popup-tip {
    background: #fefce8;
}

.custom-popup.popup-purple .leaflet-popup-content-wrapper,
.custom-popup.popup-purple .leaflet-popup-tip {
    background: #f5f3ff;
}


.custom-popup.popup-red .popup-button {
    background: linear-gradient(135deg, #dc2626, #ef4444);
}

.custom-popup.popup-green .popup-button {
    background: linear-gradient(135deg, #059669, #10b981);
}

.custom-popup.popup-orange .popup-button {
    background: linear-gradient(135deg, #ea580c, #f97316);
}

.custom-popup.popup-yellow .popup-button {
    background: linear-gradient(135deg, #ca8a04, #eab308);
}

.custom-popup.popup-purple .popup-button {
    background: linear-gradient(135deg, #7c3aed, #8b5cf6);
} 



.custom-popup .popup-button {
    display: inline-block;
    padding: 10px 16px;
    border-radius: 8px;
    color: white;
    font-weight: 600;
    text-decoration: underline;
    text-decoration-color: currentColor;
}

.popup-image{
    display:block;
    width:100%;
    max-width:220px;
    height:150px;
    object-fit:cover;
    margin:10px auto;
    border-radius:10px;
}
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f3f6fa;
      }
      #map {
        height: 100%;
        width: 100%;
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .map-frame {
        position: relative;
        height: 100%;
        padding: 20px;
        box-sizing: border-box;
       }
      .map-card {
        position: absolute;
        left: 14px;
        top: 14px;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 14px;
        padding: 12px 14px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.10);
        max-width: 280px;
        backdrop-filter: blur(8px);
      } 
      .map-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.15);
      }
      .map-card h1 {
        margin: 0 0 6px;
        font-size: 1rem;
        color: #2d3748;
        font-weight: 700;
      }
      .map-card p {
        margin: 0 0 10px;
        color: #4a5568;
        line-height: 1.4;
        font-size: 0.92rem;
      }
      .style-button {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 0.82rem;
        cursor: pointer;
        font-weight: 500;
        text-decoration: none;
        box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
      }
      .button-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      .map-legend {
        position: absolute;
        right: 14px;
        top: 14px;
        z-index: 1000;
        width: 180px;
        background: rgba(255, 255, 255, 0.92);
        border-radius: 14px;
        padding: 10px 12px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.10);
        backdrop-filter: blur(8px);
      }
      .map-legend h2 {
        margin: 0 0 8px;
        color: #1f2937;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
      }
      .legend-item {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 6px;
        color: #334155;
        font-size: 0.88rem;
      }
      .legend-dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        display: inline-block;
      }
      .legend-dot.red { background: #ef4444; }
      .legend-dot.green { background: #10b981; }
      .legend-dot.orange { background: #f97316; }
      .legend-dot.yellow { background: #facc15; }
      .legend-dot.purple { background: #8b5cf6; }
      
    </style>
</head>
<body>
    <div class="map-frame">
      <div class="map-card">
        <h1>Mapa de San Miguel Cuyutlán</h1>
        <p>Haz clic en un marcador para ver más información.</p>
      </div>
      <div class="map-legend">
        <h2>Categorías</h2>
        <div class="legend-item"><span class="legend-dot red"></span>  Lugares turísticos</div>
        <div class="legend-item"><span class="legend-dot green"></span>  Áreas verdes</div>
        <div class="legend-item"><span class="legend-dot orange"></span>  Servicios</div>
        <div class="legend-item"><span class="legend-dot yellow"></span>  Instituciones educativas</div>

    <!-- Carga la librería Leaflet para generar el mapa interactivo. -->
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Inicializa el mapa en el div #map y fija la vista inicial para este pueblo.
        var map = L.map('map', { zoomControl: false }).setView([20.412500, -103.323000], 13);

        // Define las capas base del mapa: estilo claro y estilo a color.

        // Tile layer blanco (light)
        var lightLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        });

        // Tile layer a color (voyager)
        var colorLayer = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 20
        });

        // Iniciar con el layer a color
        colorLayer.addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        // Geolocalización: muestra la posición del usuario si el navegador lo permite.
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(function(position) {
                var userLatLng = [position.coords.latitude, position.coords.longitude];
                if (!window.userLocationMarker) {
                    window.userLocationMarker = L.circleMarker(userLatLng, {
                        radius: 8,
                        color: '#2563eb',
                        fillColor: '#3b82f6',
                        fillOpacity: 0.95,
                        weight: 3
                    }).addTo(map);
                    window.userLocationCircle = L.circle(userLatLng, {
                        radius: 40,
                        color: '#60a5fa',
                        fillColor: '#93c5fd',
                        fillOpacity: 0.2,
                        weight: 1
                    }).addTo(map);
                    window.userLocationMarker.bindPopup('Tu ubicación');
                } else {
                    window.userLocationMarker.setLatLng(userLatLng);
                    window.userLocationCircle.setLatLng(userLatLng);
                }
            }, function() {
                console.warn('No se pudo obtener la ubicación del usuario.');
            }, {
                enableHighAccuracy: true,
                maximumAge: 10000,
                timeout: 20000
            });
        }

        var locations = [

        ];

        var cardTitle = document.querySelector('.map-card h1');
        var cardDesc = document.querySelector('.map-card p');
        var cardWrapper = document.querySelector('.map-card');
        var defaultPopupImage = 'Ejem1.jpg'; // Imagen por defecto usada solo si no hay imagen asignada

        /* Mantener interfaz actual: tarjeta actualiza con animación suave al seleccionar marcador */
        function updateCard(location) {
            cardWrapper.classList.add('fade-update');
            cardTitle.textContent = location.name;
            cardDesc.textContent = location.description;
            setTimeout(function() {
                cardWrapper.classList.remove('fade-update');
            }, 260);
        }

        // Agregar marcadores personalizados al mapa
// Lugares turísticos
var redLocations = [
    'Plaza Principal de San Miguel Cuyutlán',
    'Parroquia de San Miguel Arcángel',
    'Jardín de Cuyutlán',
    'Plaza de Toros San Miguel',
    'Capilla Cristo Rey',
    'Paseo de Caballo',
    'Paseo de Caballo Final',
    'Caballos de San Miguel Cuyutlán'
];

// Naturaleza y recreación
var greenLocations = [
    'Deportivo San Miguel Cuyutlán',
    'Campo del Rápido'
];

// Servicios
var orangeLocations = [
    'Centro de Salud San Miguel Cuyutlán',
    'Delegación Municipal',
    'Biblioteca Pública',
    'Birriería San Miguel Cuyutlán'
];

// Instituciones educativas
var yellowLocations = [
    'Colegio de Bachilleres Plantel 21',
    'Escuela Primaria Benito Juárez',
    'Telesecundaria Lázaro Cárdenas del Río',
    'Escuela Primaria Leona Vicario'
];

// Hospedaje
var purpleLocations = [
    'Villa Isabella',
    'Casa de campo "Vista Hermosa"'

];


        function getLocationCategory(locationName) {
            if (redLocations.includes(locationName)) {
                return 'red';
            } else if (greenLocations.includes(locationName)) {
                return 'green';
            } else if (purpleLocations.includes(locationName)) {
                return 'purple';
            } else if (yellowLocations.includes(locationName)) {
                return 'yellow';
            } else if (orangeLocations.includes(locationName)) {
                return 'orange';
            }
            return 'default';
        }

        locations.forEach(function(location) {
            var icon = customIcon;
            var category = getLocationCategory(location.name);
            if (category === 'red') {
                icon = redIcon;
            } else if (category === 'green') {
                icon = greenIcon;
            } else if (category === 'purple') {
                icon = purpleIcon;
            } else if (category === 'yellow') {
                icon = yellowIcon;
            } else if (category === 'orange') {
                icon = orangeIcon;
            }

            var marker = L.marker(location.coords, {icon: icon}).addTo(map);
            var popupImage = location.image ? location.image : defaultPopupImage;
            var directionsUrl = 'https://www.google.com/maps/search/?api=1&query=' + location.coords[0] + ',' + location.coords[1];
            var popupContent =
                '<div class="popup-card custom-popup-content">' +
                '<h3 class="popup-title">' + location.name + '</h3>' +
                '<img class="popup-image" src="imagenes/' + popupImage + '" alt="' + location.name + '" onerror="this.onerror=null;this.src=\'imagenes/' + defaultPopupImage + '\'">' +
                '<a class="popup-button" target="_blank" rel="noopener" href="' + directionsUrl + '">Cómo llegar</a>' +
                '</div>';
            marker.bindPopup(popupContent, { className: 'custom-popup popup-' + category, maxWidth: 320 });
            marker.on('click', function() {
                updateCard(location);
            });
        });

         //Agregar ruta con estilo punteado
